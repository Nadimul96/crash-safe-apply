<text class="title" x="80" y="21">crash-safe-apply · kill -9 mid-apply, then roll back</text>
<g clip-path="url(#window)">
<g class="scene s0"><text class="title-step" x="875" y="24" text-anchor="end">step 1 of 5 · preview</text><text class="line" x="18" y="59"><tspan class="d"># Preview is read-only. It prints what would change and a plan id.</tspan></text><text class="line" x="18" y="78"><tspan class="green b">$ </tspan><tspan class="b">crash-safe-apply preview demo-bundle --target site</tspan></text><rect class="cover s0c" x="33.9" y="65" width="404.4" height="19"/><g class="s0kv"><rect class="cursor s0k" x="33.9" y="66" width="7.9" height="16"/></g><text class="line s0r2" x="18" y="97"><tspan class="b">Preview</tspan><tspan>  demo-service-tls  </tspan><tspan class="d">-&gt;</tspan><tspan>  ~/demo/site</tspan></text><text class="line s0r3" x="18" y="116"><tspan class="d">  = same     README.md</tspan></text><text class="line s0r4" x="18" y="135"><tspan class="green">  + create   bin/healthcheck.sh     </tspan><tspan>       93 B</tspan></text><text class="line s0r5" x="18" y="154"><tspan class="yellow">  ~ replace  config/app.toml        </tspan><tspan>      203 B</tspan><tspan class="d">  was dd9f6fbd</tspan></text><text class="line s0r6" x="18" y="173"><tspan class="green">  + create   config/features.json   </tspan><tspan>       82 B</tspan></text><text class="line s0r7" x="18" y="192"><tspan class="green">  + create   config/tls/ciphers.conf</tspan><tspan>      110 B</tspan></text><text class="line s0r8" x="18" y="211"></text><text class="line s0r9" x="18" y="230"><tspan>  4 to write</tspan><tspan class="d"> · </tspan><tspan>1 unchanged</tspan><tspan class="d"> · </tspan><tspan>488 B</tspan><tspan class="d"> · </tspan><tspan>2 new directories</tspan></text><text class="line s0r10" x="18" y="249"><tspan>  Plan </tspan><tspan class="cyan">5ebeca20467d582d</tspan></text><text class="line s0r11" x="18" y="268"></text><text class="line s0r12" x="18" y="287"><tspan class="d">  Apply exactly this plan:</tspan></text><text class="line s0r13" x="18" y="306"><tspan>    crash-safe-apply apply demo-bundle --target site --plan 5ebeca20467d582d</tspan></text></g>
<g class="scene s1"><text class="title-step" x="875" y="24" text-anchor="end">step 2 of 5 · apply, killed mid-way</text><text class="line" x="18" y="59"><tspan class="d"># Apply exactly that plan. The demo sends SIGKILL after the second file.</tspan></text><text class="line" x="18" y="78"><tspan class="green b">$ </tspan><tspan class="b">crash-safe-apply apply demo-bundle --target site --plan 5ebeca20467d582d</tspan></text><rect class="cover s1c" x="33.9" y="65" width="578.9" height="19"/><g class="s1kv"><rect class="cursor s1k" x="33.9" y="66" width="7.9" height="16"/></g><text class="line s1r2" x="18" y="97"><tspan class="b">Apply</tspan><tspan>  demo-bundle  </tspan><tspan class="d">-&gt;</tspan><tspan>  site</tspan></text><text class="line s1r3" x="18" y="116"><tspan class="d">  journal  applying   originals backed up and plan fsynced; writing files</tspan></text><text class="line s1r4" x="18" y="135"><tspan class="green">  + created  bin/healthcheck.sh</tspan></text><text class="line s1r5" x="18" y="154"><tspan class="yellow">  ~ replaced config/app.toml</tspan></text><text class="line s1r6" x="18" y="173"><tspan class="red">Killed: 9</tspan></text></g>
<g class="scene s2 poster"><text class="title-step" x="875" y="24" text-anchor="end">step 3 of 5 · status after the crash</text><text class="line" x="18" y="59"><tspan class="d"># Status reads the journal: the run was interrupted, and here is how to finish or undo it.</tspan></text><text class="line" x="18" y="78"><tspan class="green b">$ </tspan><tspan class="b">crash-safe-apply status demo-bundle --target site</tspan></text><rect class="cover s2c" x="33.9" y="65" width="396.5" height="19"/><g class="s2kv"><rect class="cursor s2k" x="33.9" y="66" width="7.9" height="16"/></g><text class="line s2r2" x="18" y="97"><tspan class="b">Status</tspan><tspan>  demo-service-tls  </tspan><tspan class="d">-&gt;</tspan><tspan>  ~/demo/site</tspan></text><text class="line s2r3" x="18" y="116"><tspan>  State    </tspan><tspan class="b yellow">interrupted</tspan><tspan> during apply  </tspan><tspan class="d">the process stopped mid-way; no run holds the lock</tspan></text><text class="line s2r4" x="18" y="135"><tspan>  Journal  .crash-safe-apply/02a48525acd1e852/1/journal.log  </tspan><tspan class="d">last state "applying", 8 records</tspan></text><text class="line s2r5" x="18" y="154"><tspan>  Lock     </tspan><tspan class="d">stale (apply, pid 80089 has exited)</tspan></text><text class="line s2r6" x="18" y="173"></text><text class="line s2r7" x="18" y="192"><tspan>  applied   + bin/healthcheck.sh       </tspan><tspan class="green">installed</tspan></text><text class="line s2r8" x="18" y="211"><tspan>  applied   ~ config/app.toml          </tspan><tspan class="green">installed</tspan></text><text class="line s2r9" x="18" y="230"><tspan>  pending   + config/features.json     </tspan><tspan class="d">original</tspan></text><text class="line s2r10" x="18" y="249"><tspan>  pending   + config/tls/ciphers.conf  </tspan><tspan class="d">original</tspan></text><text class="line s2r11" x="18" y="268"></text><text class="line s2r12" x="18" y="287"><tspan class="d">  Next</tspan></text><text class="line s2r13" x="18" y="306"><tspan>    crash-safe-apply apply demo-bundle --target site --plan 5ebeca20467d582d   </tspan><tspan class="d">finish the interrupted apply</tspan></text><text class="line s2r14" x="18" y="325"><tspan>    crash-safe-apply rollback demo-bundle --target site                        </tspan><tspan class="d">restore every original file</tspan></text></g>
<g class="scene s3"><text class="title-step" x="875" y="24" text-anchor="end">step 4 of 5 · rollback</text><text class="line" x="18" y="59"><tspan class="d"># Roll back to the original bytes.</tspan></text><text class="line" x="18" y="78"><tspan class="green b">$ </tspan><tspan class="b">crash-safe-apply rollback demo-bundle --target site</tspan></text><rect class="cover s3c" x="33.9" y="65" width="412.4" height="19"/><g class="s3kv"><rect class="cursor s3k" x="33.9" y="66" width="7.9" height="16"/></g><text class="line s3r2" x="18" y="97"><tspan class="b">Rollback</tspan><tspan>  demo-bundle  </tspan><tspan class="d">-&gt;</tspan><tspan>  site</tspan></text><text class="line s3r3" x="18" y="116"><tspan class="d">  journal  restoring  putting originals back</tspan></text><text class="line s3r4" x="18" y="135"><tspan class="yellow">  ~ restored config/app.toml</tspan></text><text class="line s3r5" x="18" y="154"><tspan class="red">  - removed  bin/healthcheck.sh</tspan></text><text class="line s3r6" x="18" y="173"><tspan class="d">  journal  restored   every original back in place</tspan></text><text class="line s3r7" x="18" y="192"></text><text class="line s3r8" x="18" y="211"><tspan>  </tspan><tspan class="b">Restored.</tspan><tspan> Every file this bundle changed holds its original bytes again.</tspan></text></g>
<g class="scene s4"><text class="title-step" x="875" y="24" text-anchor="end">step 5 of 5 · verify</text><text class="line" x="18" y="59"><tspan class="d"># Compare with an untouched copy of the original directory.</tspan></text><text class="line" x="18" y="78"><tspan class="green b">$ </tspan><tspan class="b">diff -r -x .crash-safe-apply original site &amp;&amp; echo identical</tspan></text><rect class="cover s4c" x="33.9" y="65" width="483.7" height="19"/><g class="s4kv"><rect class="cursor s4k" x="33.9" y="66" width="7.9" height="16"/></g><text class="line s4r2" x="18" y="97"><tspan>identical</tspan></text></g>
</g>
</svg>
