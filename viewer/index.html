<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Journal Viewer</title>
		<meta name="description" content="Renders a crash-safe-apply journal.log as a timeline of state transitions. Runs entirely in the browser." />
		<meta name="color-scheme" content="light dark" />
		<link rel="stylesheet" href="viewer.css" />
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 10h14M9 16h10M9 22h6' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='22' r='3' fill='%2334d399'/%3E%3C/svg%3E"
		/>
	</head>
	<body>
		<header class="topbar">
			<div class="topbar-inner">
				<div class="brand">
					<svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
						<rect width="32" height="32" rx="8" />
						<path d="M9 10h14M9 16h10M9 22h6" />
						<circle cx="23" cy="22" r="3" />
					</svg>
					<div>
						<div class="brand-title">Journal viewer</div>
						<div class="brand-sub">crash-safe-apply</div>
					</div>
				</div>
				<div class="topbar-actions">
					<label class="sample-picker">
						<span class="visually-hidden">Sample journal</span>
						<select id="sample-select" aria-label="Sample journal"></select>
					</label>
					<label class="button" for="file-input">
						<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10m0-10L6 7m4-4 4 4M4 13v2.5A1.5 1.5 0 0 0 5.5 17h9a1.5 1.5 0 0 0 1.5-1.5V13" /></svg>
						<span>Open journal.log</span>
					</label>
					<input id="file-input" type="file" accept=".log,.txt,text/plain" hidden />
					<button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle color theme">
						<svg class="icon-sun" viewBox="0 0 20 20" aria-hidden="true">
							<circle cx="10" cy="10" r="3.5" />
							<path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4" />
						</svg>
						<svg class="icon-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.5A6.5 6.5 0 0 1 7.5 4a6.5 6.5 0 1 0 8.5 8.5Z" /></svg>
					</button>
				</div>
			</div>
		</header>

		<main id="app" class="page" aria-live="polite"></main>

		<footer class="footer page">
			<p>
				Drop a <code>journal.log</code> from <code>.crash-safe-apply/&lt;bundle&gt;/&lt;generation&gt;/</code> anywhere on this page.
				It is parsed in your browser and never uploaded.
			</p>
		</footer>

		<div id="drop-overlay" class="drop-overlay" hidden>
			<div class="drop-card">
				<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10m0 0-4-4m4 4 4-4M4 13v2.5A1.5 1.5 0 0 0 5.5 17h9a1.5 1.5 0 0 0 1.5-1.5V13" /></svg>
				<p>Drop journal.log to view it</p>
			</div>
		</div>

		<script src="samples.js"></script>
		<script src="viewer.js"></script>
	</body>
</html>
